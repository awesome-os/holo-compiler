name: holo-compiler Damped Gravity Real Build

on:
  workflow_dispatch:
    inputs:
      bounce:
        description: 'Current gravity bounce (1=b8g-shim, 2=libsectium-display, 3=publish)'
        required: false
        default: '1'
      tag:
        description: 'Release tag to publish when grounded'
        required: false
        default: 'v0.5.0-gravity'

permissions:
  actions: write
  contents: write

jobs:
  gravity-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: actions/cache@v4
        with:
          path: dist-gravity
          key: gravity-real-${{ github.event.inputs.tag || 'v0.5.0-gravity' }}-b${{ github.event.inputs.bounce || '1' }}-${{ github.run_id }}
          restore-keys: |
            gravity-real-${{ github.event.inputs.tag || 'v0.5.0-gravity' }}-

      - name: Drop 1 — Real Cross-Compile 4-OS b8g-shim (Win64 + Linux + macOS)
        if: ${{ (github.event.inputs.bounce || '1') == '1' }}
        run: |
          mkdir -p dist-gravity
          zig cc -target x86_64-windows-gnu -std=c11 -O2 -s -Wall -Wextra -Werror src/b8g_shim.c -o dist-gravity/b8g-shim.exe
          zig cc -target x86_64-linux-musl  -std=c11 -O2 -s -Wall -Wextra -Werror src/b8g_shim.c -o dist-gravity/b8g-shim-linux-x64
          zig cc -target aarch64-linux-musl -std=c11 -O2 -s -Wall -Wextra -Werror src/b8g_shim.c -o dist-gravity/b8g-shim-linux-arm64
          zig cc -target aarch64-macos      -std=c11 -O2 -s -Wall -Wextra -Werror src/b8g_shim.c -o dist-gravity/b8g-shim-macos-arm64
          ./dist-gravity/b8g-shim-linux-x64 --version
          ls -lh dist-gravity/

      - name: Drop 2 — Real Cross-Compile 5-OS libsectium-display + 78 C11 Assertions
        if: ${{ github.event.inputs.bounce == '2' }}
        run: |
          mkdir -p dist-gravity
          zig cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -shared -Iinclude src/sectium_display.c -o dist-gravity/libsectium_display.dll
          zig cc -target x86_64-linux-musl  -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC -Iinclude src/sectium_display.c -o dist-gravity/libsectium_display-linux-x64.so
          zig cc -target aarch64-linux-musl -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC -Iinclude src/sectium_display.c -o dist-gravity/libsectium_display-linux-arm64.so
          zig cc -target aarch64-macos      -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC -Iinclude src/sectium_display.c -o dist-gravity/libsectium_display-macos-arm64.dylib
          zig cc -target wasm32-wasi        -std=c11 -O2 -Wall -Wextra -Werror -mexec-model=reactor -Wl,--export-dynamic -Iinclude src/sectium_display.c -o dist-gravity/libsectium_display.wasm
          gcc -std=c11 -O2 -Wall -Wextra -Werror -DSECTIUM_DISPLAY_STATIC -Iinclude src/sectium_display_test.c src/sectium_display.c -o test_display && ./test_display
          ls -lh dist-gravity/

      - name: Drop 3 — Final Verify, Hash & Publish All 9 Real Multi-OS Binaries (GROUNDED)
        if: ${{ github.event.inputs.bounce == '3' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v0.5.0-gravity' }}
        run: |
          node --test src/nested-shard-treeshaker.test.mts src/cyclic-builder.test.mts
          sha256sum dist-gravity/* > dist-gravity/SHA256SUMS.txt
          ls -lh dist-gravity/
          gh release create "$TAG" dist-gravity/* --title "holo-compiler $TAG — Real 3-Bounce Damped Gravity Multi-OS Release" --notes "9 real multi-OS binaries (Win64, Linux x64/ARM64, macOS ARM64, WASI) built across 3 self-bouncing Damped Gravity drops." || gh release upload "$TAG" dist-gravity/* --clobber

      - name: Bounce Back Up to Next Real Build Drop
        if: ${{ (github.event.inputs.bounce || '1') == '1' || github.event.inputs.bounce == '2' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ github.event.inputs.bounce || '1' }}
          TAG: ${{ github.event.inputs.tag || 'v0.5.0-gravity' }}
        run: |
          NEXT=$((CUR + 1))
          echo "Real Drop #$CUR complete -> bouncing to Drop #$NEXT..."
          gh workflow run gravity-cycle.yml -f bounce="$NEXT" -f tag="$TAG"
