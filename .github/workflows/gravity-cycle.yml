name: holo-compiler Damped Gravity Cyclic Runner

on:
  workflow_dispatch:
    inputs:
      bounce:
        description: 'Current gravity bounce number'
        required: false
        default: '1'
      max_bounces:
        description: 'Safety cap on max bounces'
        required: false
        default: '4'
      buckets_per_bounce:
        description: 'Shards to build per bounce'
        required: false
        default: '5'
      dry_run:
        description: 'Dry-run mode'
        required: false
        default: 'true'

permissions:
  actions: write
  contents: write

jobs:
  gravity-drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            .b8g-cas
            src/dist/cyclic-state.json
          key: gravity-ball-${{ runner.os }}-b${{ github.event.inputs.bounce || '1' }}-${{ github.run_id }}
          restore-keys: |
            gravity-ball-${{ runner.os }}-
      - name: Execute Gravity Drop
        id: drop
        env:
          SECTIUM_OUT_DIR: src/dist/out
        run: |
          mkdir -p src/dist/out
          FLAG=""
          if [ "${{ github.event.inputs.dry_run || 'true' }}" = "true" ]; then FLAG="--dry-run"; fi
          node src/cyclic-builder.mts step $FLAG --buckets ${{ github.event.inputs.buckets_per_bounce || '5' }} --bounce ${{ github.event.inputs.bounce || '1' }} --max-bounces ${{ github.event.inputs.max_bounces || '4' }} --github-output
      - name: Bounce Back Up (Self-Dispatch Next Cycle)
        if: steps.drop.outputs.should_bounce == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Ball height ${{ steps.drop.outputs.height_pct }}% -> bouncing to Drop #${{ steps.drop.outputs.next_bounce }}..."
          gh workflow run gravity-cycle.yml -f bounce=${{ steps.drop.outputs.next_bounce }} -f max_bounces=${{ github.event.inputs.max_bounces || '4' }} -f buckets_per_bounce=${{ github.event.inputs.buckets_per_bounce || '5' }} -f dry_run=${{ github.event.inputs.dry_run || 'true' }}
      - name: Ball Rests on Ground
        if: steps.drop.outputs.should_bounce != 'true'
        run: |
          echo "GROUNDED ${{ steps.drop.outputs.reason }} (height=${{ steps.drop.outputs.height_pct }}%)"
