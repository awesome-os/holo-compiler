name: Release — Cross-Compile 4-OS b8g-shim (Win64 + Linux + macOS)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.0)'
        required: true
        default: 'v0.4.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Run holo-compiler Suites & Cross-Compile 4-OS b8g-shim
        run: |
          node --test src/nested-shard-treeshaker.test.mts src/cyclic-builder.test.mts
          mkdir -p dist
          zig cc -target x86_64-windows-gnu -std=c11 -O2 -s -Wall -Wextra -Werror src/b8g_shim.c -o dist/b8g-shim.exe
          zig cc -target x86_64-linux-musl  -std=c11 -O2 -s -Wall -Wextra -Werror src/b8g_shim.c -o dist/b8g-shim-linux-x64
          zig cc -target aarch64-linux-musl -std=c11 -O2 -s -Wall -Wextra -Werror src/b8g_shim.c -o dist/b8g-shim-linux-arm64
          zig cc -target aarch64-macos      -std=c11 -O2 -s -Wall -Wextra -Werror src/b8g_shim.c -o dist/b8g-shim-macos-arm64
          ./dist/b8g-shim-linux-x64 --version
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --title "holo-compiler $TAG (Win64 + Linux x64/ARM64 + macOS)" --notes "Cross-compiled fresh on GitHub Actions runner." || gh release upload "$TAG" dist/* --clobber
